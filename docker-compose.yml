services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-hubscore}
      POSTGRES_USER: ${DB_USER:-hubscore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hubscore-local}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      DB_NAME: ${DB_NAME:-hubscore}
      DB_USER: ${DB_USER:-hubscore}
      DB_PASSWORD: ${DB_PASSWORD:-hubscore-local}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-http://localhost:8081}
      IDENTITY_JWK_SET_URI: ${IDENTITY_JWK_SET_URI:-http://host.docker.internal:8081/oauth2/jwks}
      IDENTITY_AUDIENCE: ${IDENTITY_AUDIENCE:-default-api}
      BACKEND_PROVISIONING_SECRET: ${BACKEND_PROVISIONING_SECRET:-change-me}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    depends_on:
      - db

  tests:
    image: maven:3.9.6-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn test

volumes:
  dbdata:
  maven-cache:
