services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-husbcore}
      POSTGRES_USER: ${DB_USER:-husbcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-husbcore-local}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: .
    env_file:
      - .env
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    depends_on:
      - db

  tests:
    image: maven:3.9.6-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn test

volumes:
  dbdata:
  maven-cache:
