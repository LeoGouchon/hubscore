spring:
  application:
    name: husbcore
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 0

server:
  port: ${PORT:8080}

cookie:
  secure: false

identity:
  issuer: ${IDENTITY_ISSUER:http://localhost:8081}
  internal-url: ${IDENTITY_INTERNAL_URL:${identity.issuer}}
  jwk-set-uri: ${IDENTITY_JWK_SET_URI:${identity.issuer}/oauth2/jwks}
  audience: ${IDENTITY_AUDIENCE:default-api}
  provisioning-secret: ${BACKEND_PROVISIONING_SECRET:${HUSBCORE_PROVISIONING_SECRET:husbcore-secret}}
  identity-client-id: ${IDENTITY_CLIENT_ID:husbcore-client}

husbcore:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:5173
