spring:
  application:
    name: hubscore
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 0

server:
  port: ${PORT:8080}

cookie:
  secure: false

identity:
  issuer: ${IDENTITY_ISSUER:http://localhost:8081}
  jwk-set-uri: ${IDENTITY_JWK_SET_URI:${identity.issuer}/oauth2/jwks}
  audience: ${IDENTITY_AUDIENCE:default-api}

hubscore:
  provisioning-secret: ${BACKEND_PROVISIONING_SECRET:${HUBSCORE_PROVISIONING_SECRET:change-me}}
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:5173
