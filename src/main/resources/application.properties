spring.application.name=hubscore
server.port=${PORT:8080}
# HikariCP Connection Pool Tuning
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=0
# CORS
cookie.secure=false
# Identity server / OIDC resource server
identity.issuer=${IDENTITY_ISSUER:http://localhost:8081}
identity.jwk-set-uri=${IDENTITY_JWK_SET_URI:${identity.issuer}/oauth2/jwks}
identity.audience=${IDENTITY_AUDIENCE:default-api}
hubscore.provisioning-secret=${BACKEND_PROVISIONING_SECRET:${HUBSCORE_PROVISIONING_SECRET:change-me}}
# Comma-separated browser origins allowed to call this API.
hubscore.cors.allowed-origins=${HUBSCORE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
